# Codecov configuration
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%

  ignore:
    - "target/"
    - "benches/"
    - "examples/"
    - "tests/"
    - "**/*_test.rs"
    - "**/*_tests.rs"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true