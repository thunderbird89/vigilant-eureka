[package]
name = "shared-positioning"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
toml = "0.8"
serde_yaml = "0.9"
flate2 = "1.0"
bincode = "1.3"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
criterion = "0.5"
proptest = "1.0"
serial_test = "3.0"

[[bench]]
name = "message_parsing"
harness = false

[[bench]]
name = "coordinate_transformations"
harness = false