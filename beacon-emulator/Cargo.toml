[package]
name = "beacon-emulator"
version = "0.1.0"
edition = "2021"
description = "Virtual beacon emulator for underwater positioning system testing"
authors = ["Underwater Positioning Team"]

[[bin]]
name = "beacon-emulator"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# UUID generation and handling
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random number generation for movement patterns
rand = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Shared positioning library
shared-positioning = { path = "../shared-positioning" }

# Linear algebra for coordinate transformations
nalgebra = "0.33"

# Binary serialization for IPC
bincode = "1.3"

# Futures utilities
futures = "0.3"

# CSV export support
csv = "1.3"

# Hex encoding for message data
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = "0.5"
proptest = "1.4"